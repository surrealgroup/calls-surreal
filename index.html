<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <title>Reunião Estratégica · Surreal Group</title>
  <link rel="icon" type="image/svg+xml" href="https://projetos.surrealgroup.com.br/CommercialGroupCRM/favicon.svg">
  <meta name="theme-color" content="#0A1017">
  <meta name="description" content="Agende sua Reunião Estratégica com José Inácio Medici · Surreal Group.">
  <meta property="og:title" content="Reunião Estratégica · Surreal Group">
  <meta property="og:description" content="Uma hora para te dar clareza e direção. Online, pelo Google Meet.">
  <meta property="og:image" content="https://projetos.surrealgroup.com.br/CommercialGroupCRM/favicon.svg">
  <style>
    /* iframe full-width: o próprio widget traz o fundo navy-glass e o card (idêntico ao link direto) */
    html,body{margin:0;height:100%;background:#0A1017;overflow:hidden;}
    #sg-frame{border:0;width:100%;height:100%;display:block;background:#0A1017;}
    /* dica "role para ver mais" no celular: degradê sutil no rodapé (sinaliza que há mais conteúdo) */
    @media (max-width:768px){
      #sg-scrollhint{position:fixed;left:0;right:0;bottom:0;height:92px;pointer-events:none;z-index:9;
        background:linear-gradient(to top,#0A1017 10%,rgba(10,16,23,0) 100%);}
      #sg-scrollhint::after{content:"";position:absolute;left:50%;bottom:20px;width:26px;height:26px;margin-left:-13px;
        border-right:4px solid rgba(143,192,255,.98);border-bottom:4px solid rgba(143,192,255,.98);border-radius:3px;
        transform:rotate(45deg);animation:sgBob 1.5s ease-in-out infinite;
        filter:drop-shadow(0 4px 10px rgba(79,166,255,.5));}
    }
    @keyframes sgBob{0%,100%{transform:rotate(45deg) translate(0,0);opacity:.55}50%{transform:rotate(45deg) translate(3px,3px);opacity:1}}
    @media (prefers-reduced-motion:reduce){#sg-scrollhint::after{animation:none}}
  </style>
</head>
<body>
  <iframe id="sg-frame"
    src="https://links.commercialgroup.com.br/widget/booking/NryhANunHOaPLF8sjqJB?backgroundColor=%23ffffff&primaryColor=%23178af6ff&buttonText=Schedule+Meeting&showCalendarTitle=true&showCalendarDescription=true&showCalendarDetails=true&default=true"
    title="Reunião Estratégica · Surreal Group"
    allow="clipboard-write; fullscreen"
    referrerpolicy="no-referrer-when-downgrade"></iframe>
  <div id="sg-scrollhint" aria-hidden="true"></div>
</body>
</html>
